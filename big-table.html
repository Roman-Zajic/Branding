<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>financial models — Lite Grid</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root {
  --teal-900:#005A5A; --teal-700:#008282; --teal-400:#50C1C1; --teal-100:#95DFDB;
  --amber:#E1A01E; --ink:#012D2C;
  --text:#005A5A; --muted:#008282; --bg:#F0FAFA; --surface:#FFFFFF; --border:#D0ECEB; --ph:#7A9E9E;
  --font:"Segoe UI",system-ui,sans-serif;
  --mono:"Segoe UI Mono","Cascadia Mono",ui-monospace,monospace;
  --r:10px; --rb:6px;
}
[data-theme="dark"] {
  --text:#95DFDB; --muted:#50C1C1; --bg:#012D2C; --surface:#032F2E; --border:#0A5050; --ph:#3A6E6E;
}
*,*::before,*::after { box-sizing:border-box; }
body { font-family:var(--font); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  background:var(--bg); color:var(--text); margin:0; display:flex; flex-direction:column; height:100vh; }

/* ── Nav ────────────────────────────────────────────────────── */
nav { position:sticky; top:0; z-index:200; height:52px; background:var(--teal-900);
  padding:0 32px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.brand { font-size:16px; font-weight:600; color:var(--teal-100); text-decoration:none; }

/* ── Buttons ────────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:9px 20px; font-family:var(--font);
  font-size:14px; font-weight:600; line-height:1; border-radius:var(--rb); border:1px solid transparent;
  cursor:pointer; transition:background 130ms,color 130ms,border-color 130ms;
  background:var(--teal-900); color:#fff; border-color:var(--teal-900); }
.btn:hover { background:var(--teal-700); border-color:var(--teal-700); }
[data-theme="dark"] .btn { background:var(--teal-400); color:var(--ink); border-color:var(--teal-400); }
[data-theme="dark"] .btn:hover { background:var(--teal-100); border-color:var(--teal-100); }
.btn-out { background:transparent; color:var(--text); border-color:var(--border); }
.btn-out:hover { color:var(--teal-700); border-color:var(--teal-700); }
nav .btn-out { color:var(--teal-100); border-color:rgba(149,223,219,.4); font-size:13px; padding:6px 14px; }
nav .btn-out:hover { background:rgba(149,223,219,.12); border-color:rgba(149,223,219,.7); }

/* ── Inputs ─────────────────────────────────────────────────── */
input[type="text"] { width:100%; padding:9px 12px; font-family:var(--font); font-size:14px;
  border:1px solid var(--border); border-radius:var(--rb); background:var(--surface); color:var(--text);
  outline:none; transition:border-color 130ms,box-shadow 130ms; }
input[type="text"]::placeholder { color:var(--ph); }
input[type="text"]:hover { border-color:var(--teal-700); }
input[type="text"]:focus { border-color:var(--teal-700); box-shadow:0 0 0 3px rgba(0,130,130,.15); }
[data-theme="dark"] input[type="text"]:focus { border-color:var(--teal-400); box-shadow:0 0 0 3px rgba(80,193,193,.20); }

/* ── Layout ─────────────────────────────────────────────────── */
.main { padding:20px; flex:1; display:flex; flex-direction:column; overflow:hidden; }
.toolbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
#info { font-size:12px; color:var(--muted); margin-left:auto; }

/* ── Drop zone ──────────────────────────────────────────────── */
.drop-zone { display:flex; align-items:center; gap:10px; padding:10px 20px;
  border:2px dashed var(--border); border-radius:var(--r); cursor:pointer;
  transition:border-color 130ms,background 130ms; background:var(--surface); font-size:13px; color:var(--muted); }
.drop-zone:hover,.drop-zone.drag-over { border-color:var(--teal-700); background:var(--bg); color:var(--teal-700); }
.drop-label { pointer-events:none; }
#drop-filename { font-weight:600; color:var(--text); pointer-events:none; }

/* ── Grid box ───────────────────────────────────────────────── */
.grid-box { flex:1; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); box-shadow:0 1px 4px rgba(1,45,44,.10); position:relative; }
.empty-state { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--ph); font-size:13px; pointer-events:none; }

/* ── Table ──────────────────────────────────────────────────── */
table { border-collapse:collapse; table-layout:fixed; width:max-content; }
th,td { padding:10px 16px; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
th { position:sticky; top:0; z-index:10; background:var(--bg); text-align:left;
  text-transform:uppercase; font-size:11px; font-weight:600; letter-spacing:0.06em;
  color:var(--muted); border-bottom:2px solid var(--border); user-select:none;
  cursor:pointer; position:relative; /* for resize handle */ }
th.filtered { color:var(--teal-900); }
[data-theme="dark"] th.filtered { color:var(--teal-100); }
th.sort-asc  .th-label::after { content:' ↑'; opacity:.5; }
th.sort-desc .th-label::after { content:' ↓'; opacity:.5; }
th.drag-over { border-left:2px solid var(--teal-700); }
th.dragging  { opacity:.4; }

td { font-family:var(--mono); font-variant-numeric:tabular-nums; }
tbody tr:hover td { background:var(--bg); }

/* ── Total column highlight ─────────────────────────────────── */
td.has-total { background:rgba(0,130,130,.05); border-right:2px solid var(--teal-100); }
[data-theme="dark"] td.has-total { background:rgba(80,193,193,.07); }
tbody tr:hover td.has-total { background:rgba(0,130,130,.10); }

/* ── Totals footer ──────────────────────────────────────────── */
tfoot { display:none; }
tfoot.visible { display:table-footer-group; }
tfoot td { position:sticky; bottom:0; z-index:10; background:var(--teal-900); color:var(--teal-100);
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:13px;
  border-top:2px solid var(--teal-700); border-bottom:none; }
tfoot td.total-value { color:#fff; }
[data-theme="dark"] tfoot td { background:var(--ink); }

/* ── Header pill buttons ────────────────────────────────────── */
.th-btns { float:right; display:inline-flex; gap:3px; margin-top:1px; }
.pill-btn { display:inline-flex; align-items:center; background:none; border:1px solid var(--border);
  border-radius:999px; cursor:pointer; color:var(--muted); padding:1px 7px;
  font-family:var(--font); font-size:10px; font-weight:600; letter-spacing:0.04em;
  text-transform:uppercase; transition:color 130ms,border-color 130ms,background 130ms; }
.pill-btn:hover { color:var(--teal-900); border-color:var(--teal-700); background:var(--surface); }
.pill-btn.active-filter { color:var(--ink); background:var(--amber); border-color:var(--amber); }
.pill-btn.active-total  { color:#fff; background:var(--teal-700); border-color:var(--teal-700); }

/* ── Resize handle ──────────────────────────────────────────── */
.resize-handle { position:absolute; right:0; top:0; bottom:0; width:6px;
  cursor:col-resize; z-index:1; border-radius:0 3px 3px 0; }
.resize-handle:hover { background:var(--teal-700); opacity:.4; }
body.resizing { cursor:col-resize; user-select:none; }
body.resizing * { pointer-events:none; }
body.resizing .resize-handle { pointer-events:auto; }

/* ── Popups (shared base) ───────────────────────────────────── */
.popup { position:fixed; background:var(--surface); border:1px solid var(--teal-700);
  padding:12px; border-radius:var(--r); display:none; z-index:300;
  box-shadow:0 4px 16px rgba(1,45,44,.18); width:224px; }
.popup .btn { width:100%; justify-content:center; margin-top:2px; }
.f-list { max-height:160px; overflow-y:auto; margin:8px 0 10px;
  border:1px solid var(--border); border-radius:6px; }
.f-item { display:flex; align-items:center; gap:8px; padding:5px 8px;
  font-size:13px; font-family:var(--font); cursor:pointer; color:var(--text); }
.f-item:hover { background:var(--bg); }
.f-item input[type="checkbox"] { appearance:none; -webkit-appearance:none; width:15px; height:15px;
  flex-shrink:0; border:1.5px solid var(--border); border-radius:3px; background:var(--surface);
  cursor:pointer; position:relative; transition:background 130ms,border-color 130ms; }
.f-item input[type="checkbox"]:hover { border-color:var(--teal-700); }
.f-item input[type="checkbox"]:checked { background:var(--teal-700); border-color:var(--teal-700); }
.f-item input[type="checkbox"]:indeterminate { background:var(--teal-100); border-color:var(--teal-700); }
.f-item input[type="checkbox"]:checked::after { content:''; position:absolute; left:3px; top:0;
  width:5px; height:9px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg); }
.popup-header { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:8px; }
#filter-pop > .f-item { border-bottom:1px solid var(--border); font-weight:600; font-size:12px; color:var(--muted); }

/* Settings popup — wider to fit column names */
#settings-pop { width:200px; }
#settings-pop .f-list { margin:0; }
</style>
</head>
<body>

<nav>
  <a class="brand" href="#">financial&nbsp;models</a>
  <button class="btn btn-out" id="theme-btn" onclick="toggleTheme()">Light</button>
</nav>

<div class="main">
  <div class="toolbar">
    <input type="file" id="up" accept=".xlsx,.xls" hidden onchange="loadFile(this)">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('up').click()">
      <span class="drop-label">Drop Excel file here or <u>click to browse</u></span>
      <span id="drop-filename"></span>
    </div>
    <span id="info"></span>
    <button class="btn btn-out" id="col-settings-btn" onclick="openSettings(event)" style="display:none">Columns</button>
  </div>

  <div class="grid-box" id="box" onscroll="render()">
    <div class="empty-state" id="empty">Load an Excel file to get started</div>
    <table id="tbl" style="display:none">
      <colgroup id="colgroup"></colgroup>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
      <tfoot id="foot"><tr id="foot-row"></tr></tfoot>
    </table>
  </div>
</div>

<!-- Filter popup -->
<div id="filter-pop" class="popup">
  <input type="text" id="f-srch" placeholder="Search…" oninput="filterItems(this.value)" style="margin-bottom:8px">
  <label class="f-item">
    <input type="checkbox" id="f-all" checked onchange="toggleAll(this.checked)">
    Select all
  </label>
  <div class="f-list" id="f-list"></div>
  <button class="btn" onclick="applyFilter()">Apply</button>
</div>

<!-- Column settings popup -->
<div id="settings-pop" class="popup">
  <div class="popup-header">Columns</div>
  <div class="f-list" id="settings-list"></div>
</div>

<script>
/* ── State ──────────────────────────────────────────────────── */
let data = [], filtered = [], headers = [];
let colOrder  = [];          // display order: array of original indices
let hiddenCols = new Set();  // original indices that are hidden
let colWidths  = [];         // px width per original index
let activeF    = {};         // original index (num) → Set of string values
let totalsSet  = new Set();  // original indices with totals enabled
let curCol     = null;
let wasDragged = false;
let dragSrcPos = null;
const RH = 41;
const DEFAULT_W = 200;

const visibleCols = () => colOrder.filter(i => !hiddenCols.has(i));

/* ── Theme ──────────────────────────────────────────────────── */
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  document.getElementById('theme-btn').textContent = next === 'dark' ? 'Dark' : 'Light';
}

/* ── File drop zone ─────────────────────────────────────────── */
const dropZone = document.getElementById('drop-zone');
['dragenter','dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); })
);
['dragleave','drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); })
);
dropZone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
function loadFile(input) { readFile(input.files[0]); }

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const wb  = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1 });
    headers    = raw[0] || [];
    data       = raw.slice(1);
    filtered   = [...data];
    colOrder   = headers.map((_, i) => i);
    colWidths  = headers.map(() => DEFAULT_W);
    hiddenCols.clear();
    activeF    = {};
    totalsSet.clear();
    document.getElementById('drop-filename').textContent = file.name;
    document.getElementById('empty').style.display = 'none';
    document.getElementById('tbl').style.display = '';
    document.getElementById('col-settings-btn').style.display = '';
    renderHeaders();
    render();
  };
  reader.readAsArrayBuffer(file);
}

/* ── Close popups on outside click / Escape ─────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePopup('filter-pop'); closePopup('settings-pop'); }
});
document.addEventListener('click', e => {
  if (!e.target.closest('#filter-pop')   && !e.target.closest('.pill-btn'))   closePopup('filter-pop');
  if (!e.target.closest('#settings-pop') && !e.target.closest('#col-settings-btn')) closePopup('settings-pop');
});
function closePopup(id) { document.getElementById(id).style.display = 'none'; }

/* ── Render headers ─────────────────────────────────────────── */
function renderHeaders() {
  const vis = visibleCols();

  // colgroup — drives all column widths without re-rendering rows
  document.getElementById('colgroup').innerHTML =
    vis.map(i => `<col style="width:${colWidths[i]}px">`).join('');

  document.getElementById('head').innerHTML = `<tr>${vis.map((origIdx, pos) => {
    const isF = !!activeF[origIdx];
    const isT = totalsSet.has(origIdx);
    const sc  = sortState.col === origIdx ? (sortState.dir ? 'sort-asc' : 'sort-desc') : '';
    return `<th class="${isF ? 'filtered ' : ''}${sc}"
      draggable="true"
      onclick="sortCol(${origIdx})"
      ondragstart="colDragStart(event,${pos})"
      ondragover="colDragOver(event,${pos})"
      ondrop="colDrop(event,${pos})"
      ondragend="colDragEnd()">
      <span class="th-label">${headers[origIdx] || ''}</span>
      <span class="th-btns">
        <button class="pill-btn${isT ? ' active-total' : ''}"   onclick="toggleTotal(event,${origIdx})">∑</button>
        <button class="pill-btn${isF ? ' active-filter' : ''}" onclick="openF(event,${origIdx})">filter</button>
      </span>
      <div class="resize-handle" onmousedown="startResize(event,${origIdx})"></div>
    </th>`;
  }).join('')}</tr>`;
}

/* ── Render rows (virtual scroll) ───────────────────────────── */
function render() {
  const vis   = visibleCols();
  const box   = document.getElementById('box');
  const start = Math.floor(box.scrollTop / RH);
  const end   = start + 30;
  const topPad = start * RH;
  const botPad = Math.max(0, (filtered.length - end) * RH);

  document.getElementById('info').textContent = `${filtered.length.toLocaleString()} rows`;
  document.getElementById('body').innerHTML =
    `<tr style="height:${topPad}px"></tr>` +
    filtered.slice(start, end).map(r =>
      `<tr>${vis.map(i => `<td class="${totalsSet.has(i) ? 'has-total' : ''}">${r[i] ?? ''}</td>`).join('')}</tr>`
    ).join('') +
    `<tr style="height:${botPad}px"></tr>`;

  renderTotals();
}

/* ── Totals ─────────────────────────────────────────────────── */
function toggleTotal(e, origIdx) {
  e.stopPropagation();
  totalsSet.has(origIdx) ? totalsSet.delete(origIdx) : totalsSet.add(origIdx);
  renderHeaders();
  render();
}

function renderTotals() {
  const vis  = visibleCols();
  const foot = document.getElementById('foot');
  const anyVisible = vis.some(i => totalsSet.has(i));
  if (!anyVisible) { foot.classList.remove('visible'); return; }
  foot.classList.add('visible');
  document.getElementById('foot-row').innerHTML = vis.map(i => {
    if (!totalsSet.has(i)) return `<td></td>`;
    const sum = filtered.reduce((acc, r) => {
      const v = parseFloat(String(r[i] ?? '').replace(/[, ]/g, ''));
      return acc + (isNaN(v) ? 0 : v);
    }, 0);
    const fmt = Number.isInteger(sum)
      ? sum.toLocaleString()
      : sum.toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 });
    return `<td class="total-value" title="Sum of ${filtered.length.toLocaleString()} visible rows">${fmt}</td>`;
  }).join('');
}

/* ── Sort ───────────────────────────────────────────────────── */
const sortState = { col:null, dir:true };
function sortCol(origIdx) {
  if (wasDragged) { wasDragged = false; return; }
  if (sortState.col === origIdx) sortState.dir = !sortState.dir;
  else { sortState.col = origIdx; sortState.dir = true; }
  filtered.sort((a, b) => (a[origIdx] > b[origIdx] ? 1 : a[origIdx] < b[origIdx] ? -1 : 0) * (sortState.dir ? 1 : -1));
  renderHeaders();
  render();
}

/* ── Column resize ──────────────────────────────────────────── */
function startResize(e, origIdx) {
  e.stopPropagation();
  e.preventDefault();
  const startX = e.clientX;
  const startW = colWidths[origIdx];
  document.body.classList.add('resizing');

  const onMove = ev => {
    colWidths[origIdx] = Math.max(60, startW + ev.clientX - startX);
    // Update only the <col> element — no re-render needed
    const pos = visibleCols().indexOf(origIdx);
    const col = document.querySelectorAll('#colgroup col')[pos];
    if (col) col.style.width = colWidths[origIdx] + 'px';
  };
  const onUp = () => {
    document.body.classList.remove('resizing');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* ── Column reorder (drag) ──────────────────────────────────── */
function colDragStart(e, pos) {
  dragSrcPos = pos;
  wasDragged = true;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}

function colDragOver(e, pos) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('th').forEach(th => th.classList.remove('drag-over'));
  if (pos !== dragSrcPos) e.currentTarget.classList.add('drag-over');
}

function colDrop(e, pos) {
  e.preventDefault();
  document.querySelectorAll('th').forEach(th => th.classList.remove('drag-over', 'dragging'));
  if (dragSrcPos === null || dragSrcPos === pos) return;
  const vis      = visibleCols();
  const srcOrig  = vis[dragSrcPos];
  const tgtOrig  = vis[pos];
  const srcInOrder = colOrder.indexOf(srcOrig);
  const tgtInOrder = colOrder.indexOf(tgtOrig);
  colOrder.splice(srcInOrder, 1);
  colOrder.splice(tgtInOrder, 0, srcOrig);
  dragSrcPos = null;
  renderHeaders();
  render();
}

function colDragEnd() {
  document.querySelectorAll('th').forEach(th => th.classList.remove('drag-over', 'dragging'));
  dragSrcPos = null;
  // Reset flag after click event has had chance to fire
  setTimeout(() => { wasDragged = false; }, 0);
}

/* ── Column visibility settings ─────────────────────────────── */
function openSettings(e) {
  e.stopPropagation();
  const pop = document.getElementById('settings-pop');
  if (pop.style.display === 'block') { pop.style.display = 'none'; return; }

  // List columns in current display order
  document.getElementById('settings-list').innerHTML = colOrder.map(origIdx =>
    `<label class="f-item">
      <input type="checkbox" ${hiddenCols.has(origIdx) ? '' : 'checked'}
        onchange="toggleCol(${origIdx}, this.checked)">
      ${headers[origIdx] || '(empty)'}
    </label>`
  ).join('');

  const rect = e.currentTarget.getBoundingClientRect();
  pop.style.display = 'block';
  pop.style.top  = (rect.bottom + 6) + 'px';
  pop.style.left = Math.max(4, rect.right - 200) + 'px';
}

function toggleCol(origIdx, checked) {
  checked ? hiddenCols.delete(origIdx) : hiddenCols.add(origIdx);
  renderHeaders();
  render();
}

/* ── Filter ─────────────────────────────────────────────────── */
function openF(e, origIdx) {
  e.stopPropagation();
  curCol = origIdx;
  const pop  = document.getElementById('filter-pop');
  // Values limited to rows passing all OTHER active filters
  const base = data.filter(r =>
    Object.keys(activeF).filter(k => +k !== origIdx).every(k => activeF[k].has(String(r[k] ?? '')))
  );
  const vals = [...new Set(base.map(r => String(r[origIdx] ?? '')))].sort();
  pop.style.display = 'block';
  pop.style.top  = Math.min(e.clientY + 8, window.innerHeight - 300) + 'px';
  pop.style.left = Math.max(4, e.clientX - 224) + 'px';
  document.getElementById('f-srch').value = '';
  document.getElementById('f-list').innerHTML = vals.map(v =>
    `<label class="f-item">
       <input type="checkbox" class="f-cb" value="${v}"
         ${!activeF[origIdx] || activeF[origIdx].has(v) ? 'checked' : ''}>
       ${v || '<em style="color:var(--ph)">(Empty)</em>'}
     </label>`
  ).join('');
  syncSelectAll();
}

function toggleAll(chk) { document.querySelectorAll('.f-cb').forEach(c => c.checked = chk); }

function syncSelectAll() {
  const all = [...document.querySelectorAll('.f-cb')];
  const fa  = document.getElementById('f-all');
  fa.checked       = all.every(c => c.checked);
  fa.indeterminate = !fa.checked && all.some(c => c.checked);
}

function filterItems(val) {
  document.querySelectorAll('#f-list .f-item').forEach(el =>
    el.style.display = el.textContent.toLowerCase().includes(val.toLowerCase()) ? '' : 'none'
  );
}

function applyFilter() {
  const sel = [...document.querySelectorAll('.f-cb:checked')].map(c => c.value);
  const all = [...document.querySelectorAll('.f-cb')].map(c => c.value);
  if (sel.length === all.length) delete activeF[curCol];
  else activeF[curCol] = new Set(sel);
  filtered = data.filter(r =>
    Object.keys(activeF).every(k => activeF[k].has(String(r[k] ?? '')))
  );
  closePopup('filter-pop');
  renderHeaders();
  render();
}
</script>
</body>
</html>
